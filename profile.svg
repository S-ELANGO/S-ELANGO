      <rect x="259" y="0" width="75" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
      <text x="265" y="14" fill="#7dd3fc" font-size="10" class="text-font">LangGraph</text>

      <rect x="341" y="0" width="55" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
      <text x="350" y="14" fill="#7dd3fc" font-size="10" class="text-font">Docker</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="52" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
      <text x="9" y="14" fill="#7dd3fc" font-size="10" class="text-font">MySQL</text>

      <rect x="58" y="0" width="50" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
      <text x="69" y="14" fill="#7dd3fc" font-size="10" class="text-font">Neo4j</text>

      <rect x="115" y="0" width="54" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
      <text x="124" y="14" fill="#7dd3fc" font-size="10" class="text-font">Qdrant</text>

      <rect x="176" y="0" width="55" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
      <text x="187" y="14" fill="#7dd3fc" font-size="10" class="text-font">SQLite</text>

      <rect x="238" y="0" width="52" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
      <text x="248" y="14" fill="#7dd3fc" font-size="10" class="text-font">GitHub</text>

      <rect x="297" y="0" width="60" height="20" rx="10" stroke="#0284c7" fill="#082f49" />
