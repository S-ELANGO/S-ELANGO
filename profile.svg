<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" width="100%" height="100%">
  <defs>
    <!-- Sci-Fi Glow & Blur Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laser-glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="1" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="70%" stop-color="#00f3ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.4" />
    </pattern>

    <!-- Halftone Dot Grid Pattern -->
    <pattern id="dotMatrix" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#38bdf8" opacity="0.4" />
    </pattern>

    <!-- Profile Area Clip Path -->
    <clipPath id="photoClip">
      <rect x="52" y="112" width="376" height="376" rx="10" />
    </clipPath>

    <style>
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .scanner-beam {
        animation: scan 3s ease-in-out infinite alternate;
      }
      .live-dot {
        animation: blink 1.8s infinite ease-in-out;
      }
      .text-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Dark Background -->
  <rect width="950" height="600" fill="#040b14" rx="16" />

  <!-- Outer HUD Frame -->
  <rect x="18" y="18" width="914" height="564" rx="14" fill="#05101f" stroke="#0284c7" stroke-width="2" />
  
  <!-- Outer Corner HUD Accents -->
  <path d="M 28 45 L 28 28 L 45 28" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 922 45 L 922 28 L 905 28" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 28 555 L 28 572 L 45 572" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 922 555 L 922 572 L 905 572" fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- Window Header / Tabs -->
  <circle cx="50" cy="46" r="6" fill="#ef4444" />
  <circle cx="70" cy="46" r="6" fill="#f59e0b" />
  <circle cx="90" cy="46" r="6" fill="#10b981" />
  
  <text x="120" y="51" fill="#38bdf8" font-size="14" font-weight="700" class="text-font">elango_profile.md &gt;_</text>

  <g transform="translate(560, 36)" font-size="12" class="text-font" fill="#67e8f9">
    <text x="0" y="15">&lt;/&gt; Code</text>
    <text x="75" y="15">◫ Projects</text>
    <text x="165" y="15">⊟ Experience</text>
    <text x="270" y="15">✉ Contact</text>
  </g>

  <!-- ================= LEFT PANEL: VISUAL.MAP ================= -->
  <rect x="42" y="78" width="396" height="452" rx="10" fill="#041527" stroke="#0ea5e9" stroke-width="1.8" />
  
  <!-- VISUAL.MAP Header Tag -->
  <path d="M 52 78 L 165 78 L 175 96 L 52 96 Z" fill="#0284c7" opacity="0.3" />
  <text x="60" y="91" fill="#38bdf8" font-size="11" font-weight="800" class="text-font" letter-spacing="1.5">VISUAL.MAP</text>

  <!-- Scanning Target Viewport -->
  <g clip-path="url(#photoClip)">
    <!-- Base Hologram Layer -->
    <rect x="52" y="112" width="376" height="376" fill="#031b2e" />

    <!-- Replace the href below with a direct raw URL of your portrait for full clarity -->
    <image href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9tkyD1bTfH6LOuwGIuuN7-6HNqe0RLDZqG8nvmMn2Qw&s" 
           x="52" y="112" width="376" height="376" 
           preserveAspectRatio="xMidYMid slice" 
           opacity="0.85" />

    <!-- Cyber Matrix Scanline & Dots overlay -->
    <rect x="52" y="112" width="376" height="376" fill="url(#dotMatrix)" mix-blend-mode="screen" />
    <rect x="52" y="112" width="376" height="376" fill="url(#scanlines)" />

    <!-- Sci-Fi Reticle Overlay -->
    <circle cx="240" cy="300" r="130" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="8 6" fill="none" opacity="0.4" />
    <circle cx="240" cy="300" r="100" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.3" />
    <line x1="240" y1="120" x2="240" y2="480" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.4" />
    <line x1="60" y1="300" x2="420" y2="300" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.4" />

    <!-- ANIMATED SCANNING BEAM -->
    <g class="scanner-beam">
      <rect x="52" y="100" width="376" height="35" fill="url(#scanBeamGrad)" />
      <line x1="52" y1="135" x2="428" y2="135" stroke="#67e8f9" stroke-width="2.5" filter="url(#laser-glow)" />
      <circle cx="70" cy="135" r="3" fill="#ffffff" filter="url(#glow)" />
      <circle cx="410" cy="135" r="3" fill="#ffffff" filter="url(#glow)" />
    </g>
  </g>

  <!-- Left Footer Status -->
  <text x="56" y="515" fill="#38bdf8" font-size="11.5" class="text-font">&gt; Scanning profile...</text>
  <text x="390" y="515" fill="#38bdf8" font-size="11.5" class="text-font" font-weight="700">100%</text>


  <!-- ================= RIGHT PANEL: SYSTEM.INFO ================= -->
  <rect x="460" y="78" width="450" height="452" rx="10" fill="#041527" stroke="#0ea5e9" stroke-width="1.8" />
  
  <!-- SYSTEM.INFO Header Tag -->
  <path d="M 470 78 L 590 78 L 600 96 L 470 96 Z" fill="#0284c7" opacity="0.3" />
  <text x="478" y="91" fill="#38bdf8" font-size="11" font-weight="800" class="text-font" letter-spacing="1.5">SYSTEM.INFO</text>
  
  <circle cx="830" cy="89" r="4.5" fill="#22c55e" class="live-dot" />
  <text x="842" y="93" fill="#22c55e" font-size="11.5" font-weight="bold" class="text-font">Online</text>

